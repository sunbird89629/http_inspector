name: http_inspector
description: A lightweight in-app HTTP inspector for Dio — real-time logs, in-app UI, cURL export, and pretty JSON.

version: 0.0.1

homepage: https://github.com/sunbird89629/http_inspector
repository: https://github.com/sunbird89629/http_inspector
issue_tracker: https://github.com/sunbird89629/http_inspector/issues

screenshots:
  - description: "Request list with search and filter"
    path: assets/screenshots/screenshot_1.png
  - description: "Request detail with headers and body"
    path: assets/screenshots/screenshot_2.png

environment:
  sdk: ">=2.17.6 <4.0.0"
  flutter: ">=3.0.5"

dependencies:
  clipboard: ^2.0.2
  collection: ^1.19.1
  dio: ^5.4.1

  flutter:
    sdk: flutter
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

flutter:
